<!-- Header -->
<header class="header-glass text-white shadow-sm fixed top-0 z-50 w-full">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-center items-center">
    <!-- Navegación desktop -->
    <nav
      class="hidden md:flex items-center gap-6 text-lg font-medium"
      data-aos="zoom-in"
      aria-label="Navegación principal"
    >
      <a
        routerLink="/inicio"
        routerLinkActive="text-main font-bold"
        class="hover:text-main transition"
        aria-label="Inicio"
      >Inicio</a>
      <a
        routerLink="/servicios"
        routerLinkActive="text-main font-bold"
        class="hover:text-main transition"
        aria-label="Servicios"
      >Servicios</a>
      <a
        routerLink="/nosotros"
        routerLinkActive="text-main font-bold"
        class="hover:text-main transition"
        aria-label="Nosotros"
      >Nosotros</a>
      <a
        href="https://wa.me/542494387687?text=Hola%2C%20quiero%20coordinar%20una%20conversaci%C3%B3n%20estrat%C3%A9gica"
        target="_blank"
        rel="noopener noreferrer"
        class="bg-main hover:bg-hover text-white px-4 py-2 rounded-full transition-all flex items-center gap-2"
        aria-label="Contactar por WhatsApp"
      >
        <i class="fab fa-whatsapp text-lg" aria-hidden="true"></i>Contacto
      </a>
    </nav>

    <!-- Botón hamburguesa -->
    <button
      class="md:hidden text-2xl text-main"
      (click)="toggleMenu()"
      aria-label="Abrir menú de navegación"
      [attr.aria-expanded]="menuOpen()"
    >
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Menú mobile con @if -->
  @if (menuOpen()) {
    <div
      id="mobileMenu"
      class="md:hidden flex flex-col gap-3 text-base font-medium px-6 pb-6"
      data-aos="fade-right"
    >
      <a
        routerLink="/inicio"
        routerLinkActive="text-main font-bold"
        class="flex items-center gap-2 hover:text-main"
        (click)="closeMenu()"
      >Inicio</a>
      <a
        routerLink="/servicios"
        routerLinkActive="text-main font-bold"
        class="flex items-center gap-2 hover:text-main"
        (click)="closeMenu()"
      >Servicios</a>
      <a
        routerLink="/nosotros"
        routerLinkActive="text-main font-bold"
        class="flex items-center gap-2 hover:text-main"
        (click)="closeMenu()"
      >Nosotros</a>
      <a
        href="https://wa.me/542494387687?text=Hola%2C%20quiero%20coordinar%20una%20conversaci%C3%B3n%20estrat%C3%A9gica"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center justify-center gap-2 bg-main hover:bg-hover text-white px-4 py-2 rounded-full w-full sm:w-fit mt-2 shadow-[0_0_10px_#ff0000] hover:shadow-[0_0_15px_#cc0000] transition-all"
        (click)="closeMenu()"
      >
        <i class="fab fa-whatsapp text-lg"></i>Contacto
      </a>
    </div>
  }
</header>
