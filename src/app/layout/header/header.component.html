<!-- Header -->
<header class="header-glass text-white shadow-sm fixed top-0 z-50 w-full">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-center items-center">
    <!-- Navegación desktop -->
    <nav
      class="hidden md:flex items-center gap-6 text-lg font-medium"
      data-aos="zoom-in"
      aria-label="Navegación principal"
    >
      <a
        routerLink="/inicio"
        routerLinkActive="text-main font-bold"
        class="hover:text-main transition"
        aria-label="Ir a la sección de inicio"
      >
        <i class="fas fa-home mr-1" aria-hidden="true"></i>Inicio
      </a>
      <a
        routerLink="/nosotros"
        routerLinkActive="text-main font-bold"
        class="hover:text-main transition"
        aria-label="Ir a la sección nosotros"
      >
        <i class="fas fa-users mr-1" aria-hidden="true"></i>Nosotros
      </a>
      <a
        routerLink="/servicios"
        routerLinkActive="text-main font-bold"
        class="hover:text-main transition"
        aria-label="Ir a la sección de capacidades"
      >
        <i class="fas fa-rocket mr-1" aria-hidden="true"></i>Capabilities
      </a>
      <a
        routerLink="/contacto"
        class="bg-main hover:bg-hover text-white px-4 py-2 rounded-full transition-all"
        aria-label="Ir a la sección de contacto"
      >
        <i class="fas fa-envelope mr-2" aria-hidden="true"></i>Contacto
      </a>
    </nav>

    <!-- Botón hamburguesa -->
    <button
      class="md:hidden text-2xl text-main"
      (click)="toggleMenu()"
      aria-label="Abrir menú de navegación"
      [attr.aria-expanded]="menuOpen()"
    >
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Menú mobile con @if -->
  @if (menuOpen()) {
    <div
      id="mobileMenu"
      class="md:hidden flex flex-col gap-3 text-base font-medium px-6 pb-6"
      data-aos="fade-right"
    >
      <a
        routerLink="/inicio"
        routerLinkActive="text-main font-bold"
        class="flex items-center gap-2 hover:text-main"
        (click)="closeMenu()"
      >
        <i class="fas fa-home"></i>Inicio
      </a>
      <a
        routerLink="/nosotros"
        routerLinkActive="text-main font-bold"
        class="flex items-center gap-2 hover:text-main"
        (click)="closeMenu()"
      >
        <i class="fas fa-users"></i>Nosotros
      </a>
      <a
        routerLink="/servicios"
        routerLinkActive="text-main font-bold"
        class="flex items-center gap-2 hover:text-main"
        (click)="closeMenu()"
      >
        <i class="fas fa-rocket"></i>Capabilities
      </a>
      <a
        routerLink="/contacto"
        class="flex items-center justify-center gap-2 bg-main hover:bg-hover text-white px-4 py-2 rounded-full w-full sm:w-fit mt-2 shadow-[0_0_10px_#ff1f43] hover:shadow-[0_0_15px_#ff4757] transition-all"
        (click)="closeMenu()"
      >
        <i class="fas fa-envelope"></i> Contacto
      </a>
    </div>
  }
</header>
