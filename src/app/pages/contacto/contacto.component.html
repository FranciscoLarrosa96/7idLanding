<section
  id="contacto"
  class="contacto-modern-bg text-white py-24 px-6 border-t border-white/10 scroll-mt-32 relative overflow-hidden"
>
  <div data-aos="fade-up" class="max-w-4xl mx-auto relative z-10">
    <!-- Header -->
    <div class="text-center mb-12">
      <div class="inline-block bg-main/10 text-main text-sm font-bold px-5 py-2.5 rounded-full mb-4">
        <i class="fas fa-comment-dots text-base mr-2"></i>CONTACTO
      </div>
      <h2 class="text-4xl md:text-5xl font-extrabold text-white mb-4">
        Transformá tu <span class="text-main">idea en realidad</span>
      </h2>
      <p class="text-zinc-400 text-lg max-w-2xl mx-auto">
        Completá el formulario y recibí una propuesta personalizada en menos de 48 horas
      </p>
    </div>

    <!-- Formulario -->
    <div
      class="bg-zinc-900/50 backdrop-blur-sm rounded-3xl p-8 md:p-12 border border-zinc-800 shadow-2xl"
      data-aos="zoom-in"
    >
      <form
        #formElement
        [formGroup]="contactForm"
        (ngSubmit)="sendEmail()"
        enctype="multipart/form-data"
        class="space-y-6"
      >
        <!-- Grid de 2 columnas para nombre y email -->
        <div class="grid md:grid-cols-2 gap-6">
          <!-- Nombre -->
          <div>
            <label for="nombre" class="block text-sm font-bold text-zinc-300 mb-3">
              Nombre completo <span class="text-main">*</span>
            </label>
            <div class="relative group">
              <div class="absolute inset-0 bg-gradient-to-r from-main/20 to-transparent rounded-xl opacity-0 group-focus-within:opacity-100 blur transition-opacity"></div>
              <div class="relative flex items-center gap-3 bg-zinc-800/80 rounded-xl px-5 py-4 border-2 border-zinc-700 focus-within:border-main transition-all">
                <i class="fas fa-user text-main text-lg" aria-hidden="true"></i>
                <input
                  id="nombre"
                  formControlName="nombre"
                  type="text"
                  placeholder="Juan Pérez"
                  autocomplete="name"
                  class="bg-transparent w-full outline-none text-white placeholder:text-zinc-500 text-base"
                  required
                  aria-label="Ingresá tu nombre completo"
                />
              </div>
            </div>
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-bold text-zinc-300 mb-3">
              Email corporativo <span class="text-main">*</span>
            </label>
            <div class="relative group">
              <div class="absolute inset-0 bg-gradient-to-r from-main/20 to-transparent rounded-xl opacity-0 group-focus-within:opacity-100 blur transition-opacity"></div>
              <div class="relative flex items-center gap-3 bg-zinc-800/80 rounded-xl px-5 py-4 border-2 border-zinc-700 focus-within:border-main transition-all">
                <i class="fas fa-envelope text-main text-lg" aria-hidden="true"></i>
                <input
                  id="email"
                  formControlName="email"
                  type="email"
                  placeholder="tu@empresa.com"
                  autocomplete="email"
                  class="bg-transparent w-full outline-none text-white placeholder:text-zinc-500 text-base"
                  required
                  aria-label="Ingresá tu correo electrónico"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Mensaje -->
        <div>
          <label for="mensaje" class="block text-sm font-bold text-zinc-300 mb-3">
            Contanos sobre tu proyecto <span class="text-main">*</span>
          </label>
          <div class="relative group">
            <div class="absolute inset-0 bg-gradient-to-r from-main/20 to-transparent rounded-xl opacity-0 group-focus-within:opacity-100 blur transition-opacity"></div>
            <div class="relative bg-zinc-800/80 rounded-xl px-5 py-4 border-2 border-zinc-700 focus-within:border-main transition-all">
              <div class="flex items-start gap-3">
                <i class="fas fa-comment-alt text-main text-lg mt-1" aria-hidden="true"></i>
                <textarea
                  id="mensaje"
                  formControlName="mensaje"
                  rows="6"
                  placeholder="Describe tu desafío tecnológico, objetivos y plazos esperados..."
                  class="bg-transparent w-full outline-none text-white placeholder:text-zinc-500 text-base resize-none"
                  required
                ></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- Archivo (CV) -->
        <div>
          <label for="cv" class="block text-sm font-bold text-zinc-300 mb-3">
            Adjuntar CV <span class="text-zinc-500 font-normal">(opcional)</span>
          </label>
          <div class="relative group">
            <div class="absolute inset-0 bg-gradient-to-r from-main/20 to-transparent rounded-xl opacity-0 group-focus-within:opacity-100 blur transition-opacity"></div>
            <div class="relative bg-zinc-800/80 rounded-xl px-5 py-4 border-2 border-zinc-700 border-dashed hover:border-main transition-all">
              <input
                type="file"
                (change)="onFileSelected($event)"
                class="w-full text-zinc-400 text-sm file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-main file:text-white hover:file:bg-hover file:cursor-pointer file:transition-all file:shadow-lg cursor-pointer"
                accept=".pdf,.doc,.docx"
              />
              <p class="text-xs text-zinc-500 mt-2">
                <i class="fas fa-info-circle mr-1"></i>
                Formatos aceptados: PDF, DOC, DOCX (máx. 5MB)
              </p>
            </div>
          </div>
        </div>

        <!-- Botón de envío -->
        <div class="pt-6">
          <button
            type="submit"
            class="group relative w-full bg-gradient-to-r from-main to-hover text-white px-8 py-5 rounded-xl text-lg font-bold shadow-[0_0_40px_rgba(221,14,124,0.3)] hover:shadow-[0_0_60px_rgba(221,14,124,0.6)] transition-all duration-300 hover:scale-[1.02] overflow-hidden"
          >
            <span class="absolute inset-0 bg-gradient-to-r from-white/0 via-white/20 to-white/0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></span>
            <span class="relative z-10 flex items-center justify-center gap-3">
              <i class="fas fa-paper-plane text-xl"></i>
              <span>Enviar propuesta</span>
              <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
            </span>
          </button>
          <p class="text-center text-zinc-500 text-sm mt-4">
            <i class="fas fa-lock mr-1"></i>
            Tus datos están protegidos y no serán compartidos
          </p>
        </div>
      </form>
    </div>

    <!-- Trust badges -->
    <div class="flex flex-wrap justify-center gap-8 mt-12 text-zinc-400 text-sm">
      <div class="flex items-center gap-2">
        <i class="fas fa-shield-alt text-main"></i>
        <span>ISO 9001 Certificado</span>
      </div>
      <div class="flex items-center gap-2">
        <i class="fas fa-clock text-main"></i>
        <span>Respuesta en 24hs</span>
      </div>
      <div class="flex items-center gap-2">
        <i class="fas fa-users text-main"></i>
        <span>22+ años de experiencia</span>
      </div>
    </div>
  </div>
</section>

<!-- Línea divisoria animada -->
<div class="h-1 bg-gradient-to-r from-main via-hover to-main animate-pulse opacity-70"></div>
