<!-- Hero -->
<section
  id="inicio"
  class="hero-video-bg relative text-white py-32 px-6 min-h-[100dvh] flex items-center z-[-20] scroll-mt-32"
>
  <!-- Video de fondo -->
  <video
    #heroVideo
    class="hero-background-video"
    autoplay
    loop
    muted
    playsinline
    preload="auto"
    disablepictureinpicture
    disableremoteplayback
    poster="assets/videos/backgroundVideo-img2.jpg"
  >
    <source src="assets/videos/backgroundVideo2.webm" type="video/webm" />
    <source src="assets/videos/backgroundVideo2.mp4" type="video/mp4" />
  </video>

  <!-- Overlay para intensificar el efecto rojo -->
  <div class="hero-video-overlay"></div>

  <div data-aos="zoom-in" class="hero-content-glass max-w-6xl mx-auto text-center relative z-10">
    <!-- Logo -->
    <div class="mb-8">
      <img
        src="assets/7id_logo_blanco.svg"
        alt="7 Ideas - Logo de la empresa de desarrollo de software y soluciones digitales"
        class="w-[40rem] mx-auto"
        width="640"
        height="160"
      />
    </div>
    <h1 class="text-4xl md:text-6xl font-bold leading-tight text-text mb-6">
      Tu aliado
      <span class="text-main glow-text"> Tecnológico </span>
    </h1>
    <p class="text-xl md:text-2xl text-white max-w-3xl mx-auto font-light mb-10">
      Convertimos ideas complejas en software escalable
    </p>

    <!-- CTAs Hero -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center mt-8 ctaHero">
      <a
        (click)="navigate('/contacto')"
        class="group relative inline-flex items-center gap-3 bg-main hover:bg-hover text-white font-bold px-10 py-4 rounded-lg transition-all duration-300 shadow-lg hover:shadow-[0_0_40px_rgba(221,14,124,0.6)] hover:scale-105 overflow-hidden cursor-pointer z-[99999] uppercase tracking-wider text-sm"
      >
        <span
          class="absolute inset-0 bg-gradient-to-r from-white/0 via-white/20 to-white/0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"
        ></span>
        <span class="relative z-10">Contacto</span>
      </a>
      <a
        (click)="navigate('/servicios')"
        class="inline-flex items-center gap-3 bg-transparent hover:bg-white/5 text-white font-semibold px-10 py-4 rounded-lg transition-all duration-300 border-2 border-white/30 hover:border-white/50 hover:shadow-lg cursor-pointer z-[99999] uppercase tracking-wider text-sm"
      >
        <span>Ver servicios</span>
      </a>
    </div>
    <div class="flex flex-wrap justify-center items-center gap-6 mt-8 text-zinc-400 text-sm">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-main/20 flex items-center justify-center">
          <i class="fas fa-code text-main text-xs"></i>
        </div>
        <span>+50 proyectos entregados</span>
      </div>
      <div class="w-1 h-1 rounded-full bg-zinc-600"></div>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-main/20 flex items-center justify-center">
          <i class="fas fa-award text-main text-xs"></i>
        </div>
        <span>22+ años de experiencia</span>
      </div>
    </div>
  </div>
</section>

<!-- Línea divisoria animada -->
<div
  class="h-1 bg-gradient-to-r from-main via-hover to-main animate-pulse opacity-70"
></div>
