<div class="relative min-h-screen flex flex-col bg-white">
  <!-- Top bar: back button + branding -->
  <div
    class="sticky top-0 z-50 w-full bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm px-6 py-3 flex items-center justify-between"
  >
    <a
      routerLink="/blog"
      class="flex items-center gap-2 text-slate-700 hover:text-primary transition-colors font-semibold text-sm"
    >
      <span class="material-symbols-outlined">arrow_back</span>
      Volver al Blog
    </a>
    <a routerLink="/" class="flex items-center gap-2">
      <div class="w-7 h-7 bg-primary rounded-md flex items-center justify-center">
        <span class="material-symbols-outlined text-white text-sm">rocket_launch</span>
      </div>
      <span class="font-black text-slate-900 uppercase tracking-tight text-sm">7iDeas</span>
    </a>
  </div>

  <!-- Article iframe -->
  @if (blogUrl) {
    <iframe
      [src]="blogUrl"
      class="flex-1 w-full border-none"
      style="min-height: calc(100vh - 56px)"
      title="Marketing para IA — 7iDeas"
      loading="lazy"
    ></iframe>
  } @else {
    <div class="flex-1 flex items-center justify-center">
      <span class="material-symbols-outlined text-4xl text-slate-400 animate-spin">
        progress_activity
      </span>
    </div>
  }
</div>
